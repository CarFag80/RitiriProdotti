name: Aggiorna richiami

on:
  push:
    branches: [main]
    paths:
      - repair_dates.py
      - test_dates.py
      - status_banner.js
      - .github/workflows/update-richiami.yml
  schedule:
    - cron: "0 6 * * *" # Ogni giorno: 07:00 italiane in inverno, 08:00 in estate
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero massimo di schede per fonte (vuoto = tutte)."
        required: false
        default: ""

concurrency:
  group: aggiorna-richiami
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test del parsing e recupero date
        run: python -m unittest -v test_dates.py

      - name: Installa le dipendenze
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui lo scraper
        if: github.event_name != 'push'
        shell: bash
        env:
          SCRAPER_LIMIT: ${{ github.event.inputs.limit }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python scraper.py "$SCRAPER_LIMIT" 2>&1 | tee scraper.log

      - name: Registra l'esito del controllo
        if: github.event_name != 'push'
        env:
          SCRAPER_LIMIT: ${{ github.event.inputs.limit }}
        run: python write_status.py

      - name: Recupera le date presenti nei dati locali
        run: python repair_dates.py

      - name: Incolla i dati dentro index.html
        run: python inject_data.py

      - name: Pubblica le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html manifest.json sw.js icons/

          if [ -f status.json ]; then git add status.json; fi
          git diff --quiet --cached || git commit -m "Aggiorna richiami e normalizza date"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push rifiutato (tentativo $i/3): riallineo con il remoto e riprovo..."
            sleep 5
          done
          git diff --quiet origin/main..HEAD || exit 1
