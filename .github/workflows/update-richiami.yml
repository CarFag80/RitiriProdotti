name: Aggiorna richiami

on:
  schedule:
    - cron: "0 */12 * * *"  # ogni 12 ore
  workflow_dispatch:          # avvio manuale dal tab "Actions" su GitHub
    inputs:
      limit:
        description: "Numero massimo di schede per fonte (vuoto = tutte). Utile per una prova veloce, es. 5."
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # se supera i 30 minuti qualcosa non va: meglio che si fermi da solo
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui lo scraper
        run: python scraper.py ${{ github.event.inputs.limit }}

      - name: Incolla i dati dentro index.html
        run: python inject_data.py

      - name: Pubblica le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --quiet --cached || git commit -m "Aggiorna richiami"
          git push
