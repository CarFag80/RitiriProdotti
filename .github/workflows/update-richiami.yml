name: Aggiorna richiami

on:
  schedule:
    - cron: "0 */6 * * *"   # ogni 6 ore: meno run e meno deploy Netlify
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero massimo di schede per fonte (vuoto = tutte). Utile per una prova veloce, es. 5."
        required: false
        default: ""

concurrency:
  group: aggiorna-richiami
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui lo scraper
        env:
          SCRAPER_LIMIT: ${{ github.event.inputs.limit }}
        run: python scraper.py "$SCRAPER_LIMIT"

      - name: Incolla i dati dentro index.html
        run: python inject_data.py

      - name: Pubblica le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --quiet --cached || git commit -m "Aggiorna richiami"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push rifiutato (tentativo $i/3): riallineo con il remoto e riprovo..."
            sleep 5
          done
