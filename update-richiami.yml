name: Aggiorna richiami

on:
  schedule:
    - cron: "0 */6 * * *"   # ogni 6 ore
  workflow_dispatch: {}       # avvio manuale dal tab "Actions" su GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Esegui lo scraper
        run: python scraper.py

      - name: Incolla i dati dentro index.html
        run: python inject_data.py

      - name: Pubblica le modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --quiet --cached || git commit -m "Aggiorna richiami"
          git push
