<style>
  :root{
    --paper:#F0EFE8;
    --surface:#FAF9F4;
    --ink:#20242A;
    --ink-soft:#63676C;
    --alert:#C43E1C;
    --alert-soft:#F4E1D8;
    --info:#2C4A63;
    --info-soft:#DFE6EA;
    --line:#DEDBD0;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  .shell{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
  }

  /* ---------- Header ---------- */
  header.top{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  header.top h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:34px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  header.top p.sub{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
    max-width:34ch;
  }
  .stat-line{
    margin-top:16px;
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .stat-line strong{
    font-family:var(--serif);
    font-size:20px;
    color:var(--ink);
    font-weight:600;
  }

  .demo-banner{
    margin:14px 20px 0;
    padding:10px 12px;
    background:var(--info-soft);
    color:var(--info);
    font-size:12.5px;
    border-left:3px solid var(--info);
  }

  /* ---------- Filters ---------- */
  .filters{
    display:flex;
    gap:8px;
    padding:16px 20px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    padding:7px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
  .year-select{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    padding:6px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    font-family:var(--sans);
  }

  /* ---------- Ricerca ---------- */
  .search-row{ margin-top:16px; }
  .search-box{
    width:100%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 14px;
    font-size:15px;
    font-family:var(--sans);
    border-radius:2px;
  }
  .search-box:focus{ outline:none; border-color:var(--ink); }

  /* ---------- Paginazione ---------- */
  .pagination{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px 8px;
    border-top:1px solid var(--line);
  }
  .pg-btn{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    border-radius:2px;
  }
  .pg-btn:disabled{ opacity:0.35; pointer-events:none; }
  .pg-info{
    font-size:13px;
    color:var(--ink-soft);
    font-family:var(--mono);
  }

  /* ---------- Feed ---------- */
  .feed{padding:12px 0 40px;}
  .row{
    display:flex;
    gap:16px;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .row:active{background:var(--surface);}
  .row .datecol{
    flex:0 0 54px;
    text-align:left;
    padding-top:2px;
  }
  .row .datecol .day{
    display:block;
    font-family:var(--serif);
    font-weight:700;
    font-size:22px;
    line-height:1;
  }
  .row .datecol .mon{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .row .content{flex:1; min-width:0;}
  .row .product{
    font-family:var(--serif);
    font-weight:600;
    font-size:18px;
    line-height:1.25;
    margin:0 0 2px;
  }
  .row .brand{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .row .reason{
    font-size:14px;
    margin:0 0 10px;
    color:var(--ink);
  }
  .tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
  }
  .tag.risk{background:var(--alert-soft); color:var(--alert);}
  .tag.info{background:var(--info-soft); color:var(--info);}

  .empty{
    padding:60px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
  }

  /* ---------- Detail view ---------- */
  .detail{padding:0 0 60px;}
  .back{
    display:flex;
    align-items:center;
    gap:6px;
    padding:20px 20px 0;
    font-size:14px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .detail .hero{
    padding:16px 20px 20px;
    border-bottom:1px solid var(--line);
  }
  .detail .hero .product{
    font-family:var(--serif);
    font-weight:700;
    font-size:28px;
    line-height:1.2;
    margin:12px 0 4px;
  }
  .detail .hero .brand{
    font-size:15px;
    color:var(--ink-soft);
  }

  .factlist{padding:4px 20px;}
  .fact{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:13px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .fact .label{color:var(--ink-soft); flex:0 0 40%;}
  .fact .value{
    text-align:right;
    flex:1;
  }
  .fact .value.mono{font-family:var(--mono); font-size:13px;}

  .section{padding:20px 20px 4px;}
  .section h2{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .section p{
    margin:0;
    font-size:15px;
    line-height:1.55;
  }

  .cta{
    display:block;
    margin:24px 20px 0;
    padding:14px 18px;
    background:var(--ink);
    color:var(--paper);
    text-align:center;
    font-size:14.5px;
    font-weight:600;
    border-radius:2px;
  }
  .cta:active{opacity:0.85;}

  .attach{margin:0; padding-left:18px;}
  .attach li{margin-bottom:8px; font-size:14.5px;}
  .attach a{text-decoration:underline; text-underline-offset:2px;}

  .cta-secondary{
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    margin-top:10px;
  }

  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    .fade-in{animation:none;}
  }

  footer.foot{
    padding:24px 20px 40px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
</style>

/* DATI-FINE */

function loadRecalls(){
  const embedded = RECALLS.slice().sort(byDate);
  // I dati incorporati bastano sempre: il file funziona anche aperto con
  // doppio clic (file://), senza server. Se però il sito gira su un server
  // e accanto c'è un data.json più fresco, quello ha la precedenza.
  return fetch('data.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(list => Array.isArray(list) && list.length ? list.slice().sort(byDate) : embedded)
    .catch(() => embedded);
}
function byDate(a, b){ return (b.published || '').localeCompare(a.published || ''); }

/* ---------- Helpers ---------- */
const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const MONTHS_FULL = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

function fmtShort(iso){
  const d = iso ? new Date(iso + "T00:00:00") : null;
  if (!d || isNaN(d.getTime())) return { day: '—', mon: 's.d.' };
  const yy = String(d.getFullYear()).slice(-2);
  return { day: d.getDate(), mon: `${MONTHS[d.getMonth()]} '${yy}` };
}
function fmtFull(iso){
  const d = new Date(iso + "T00:00:00");
  return `${d.getDate()} ${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`;
}
function daysSince(iso){
  const d = new Date(iso + "T00:00:00");
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function esc(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function normalize(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function matchesSearch(r){
  if (!searchQuery.trim()) return true;
  const q = normalize(searchQuery);
  const hay = normalize([r.product, r.title, r.brand, r.reasonShort].filter(Boolean).join(' '));
  return hay.includes(q);
}
function availableYears(){
  const years = new Set();
  ALL.forEach(r => {
    const y = (r.published || '').slice(0, 4);
    if (/^\d{4}$/.test(y)) years.add(y);
  });
  return Array.from(years).sort((a, b) => b.localeCompare(a));
}

/* ---------- State ---------- */
let ALL = [];
let activeFilter = 'all';
let activeYear = 'all';
let searchQuery = '';
let currentPage = 1;
const PAGE_SIZE = 20;

const FILTERS = [
  { id: 'all',  label: 'Tutti' },
  { id: 'risk', label: 'Rischio per la salute' },
  { id: 'info', label: 'Altri avvisi' }
];

/* ---------- Rendering ---------- */
const app = document.getElementById('app');

function render(){
  const hash = location.hash;
  if (hash.startsWith('#/r/')) {
    const id = decodeURIComponent(hash.slice(4));
    const item = ALL.find(r => r.id === id);
    if (item) { renderDetail(item); return; }
  }
  renderFeed();
}

function filteredItems(){
  return ALL.filter(r =>
    (activeFilter === 'all' || r.category === activeFilter) &&
    (activeYear === 'all' || (r.published || '').startsWith(activeYear)) &&
    matchesSearch(r)
  );
}

function renderFeed(){
  const recent30 = ALL.filter(r => daysSince(r.published) <= 30).length;
  const years = availableYears();

  app.innerHTML = `
    <header class="top">
      <h1>Richiami</h1>
      <p class="sub">Prodotti ritirati dai supermercati italiani, spiegati in una riga.</p>
      <div class="stat-line"><strong>${recent30}</strong> avvisi negli ultimi 30 giorni</div>
      <div class="search-row">
        <input type="search" id="searchBox" class="search-box" placeholder="Cerca per prodotto, marca o sostanza…" value="${esc(searchQuery)}">
      </div>
    </header>

    <nav class="filters">
      ${FILTERS.map(f => `<button class="chip ${f.id === activeFilter ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>`).join('')}
      <select id="yearFilter" class="year-select" aria-label="Filtra per anno">
        <option value="all">Tutti gli anni</option>
        ${years.map(y => `<option value="${y}" ${activeYear === y ? 'selected' : ''}>${y}</option>`).join('')}
      </select>
    </nav>

    <main class="feed fade-in" id="feedList"></main>
    <nav class="pagination" id="paginationBar"></nav>

    <footer class="foot">Fonte: avvisi e richiami di prodotti alimentari del Ministero della Salute. Verificare sempre la scheda ufficiale prima di agire.</footer>
  `;

  app.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      currentPage = 1;
      app.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
      renderFeedList();
    });
  });

  document.getElementById('yearFilter').addEventListener('change', (e) => {
    activeYear = e.target.value;
    currentPage = 1;
    renderFeedList();
  });

  document.getElementById('searchBox').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    currentPage = 1;
    renderFeedList();
  });

  renderFeedList();
}

function renderFeedList(){
  const items = filteredItems();
  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  document.getElementById('feedList').innerHTML = items.length === 0
    ? `<div class="empty">Nessun richiamo trovato con questi filtri.</div>`
    : pageItems.map(rowHtml).join('');

  const pagEl = document.getElementById('paginationBar');
  if (totalPages <= 1) { pagEl.innerHTML = ''; return; }

  pagEl.innerHTML = `
    <button class="pg-btn" id="pgPrev" ${currentPage <= 1 ? 'disabled' : ''}>← Precedenti</button>
    <span class="pg-info">Pagina ${currentPage} di ${totalPages}</span>
    <button class="pg-btn" id="pgNext" ${currentPage >= totalPages ? 'disabled' : ''}>Successivi →</button>
  `;
  document.getElementById('pgPrev').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderFeedList(); window.scrollTo(0, 0); }
  });
  document.getElementById('pgNext').addEventListener('click', () => {
    if (currentPage < totalPages) { currentPage++; renderFeedList(); window.scrollTo(0, 0); }
  });
}

function rowHtml(r){
  const d = fmtShort(r.published);
  return `
    <a class="row" href="#/r/${encodeURIComponent(r.id)}">
      <div class="datecol"><span class="day">${d.day}</span><span class="mon">${d.mon}</span></div>
      <div class="content">
        <p class="product">${esc(r.product || r.title || '')}</p>
        ${r.brand ? `<p class="brand">${esc(r.brand)}</p>` : ''}
        ${r.reasonShort ? `<p class="reason">${esc(r.reasonShort)}</p>` : ''}
        <span class="tag ${r.category}">${r.category === 'risk' ? 'Rischio salute' : 'Avviso'}</span>
      </div>
    </a>
  `;
}

function renderDetail(r){
  const campi = r.campi || {};
  const factsHtml = Object.keys(campi).length
    ? `<div class="factlist">` + Object.entries(campi).map(([label, value]) => `
        <div class="fact">
          <span class="label">${esc(capitalize(label))}</span>
          <span class="value ${isMono(label) ? 'mono' : ''}">${esc(value)}</span>
        </div>`).join('') + `</div>`
    : '';

  const attachHtml = (r.attachments && r.attachments.length) ? `
      <div class="section">
        <h2>Allegati</h2>
        <ul class="attach">
          ${r.attachments.map(a => `<li><a href="${a.url}" target="_blank" rel="noopener">${esc(a.name)}</a></li>`).join('')}
        </ul>
      </div>` : '';

  app.innerHTML = `
    <a class="back" href="#/">← Tutti i richiami</a>
    <div class="detail fade-in">
      <div class="hero">
        <span class="tag ${r.category}">${r.category === 'risk' ? 'Rischio salute' : 'Avviso'}</span>
        <p class="product">${esc(r.product || r.title || '')}</p>
        ${r.brand ? `<p class="brand">${esc(r.brand)}</p>` : ''}
      </div>

      ${r.reasonShort ? `
      <div class="section">
        <h2>Sostanza / rischio segnalato</h2>
        <p>${esc(r.reasonShort)}</p>
      </div>` : ''}

      ${factsHtml}
      ${attachHtml}

      <div class="section">
        <h2>Cosa fare</h2>
        <p>Controlla il numero di lotto stampato sulla confezione. In caso di corrispondenza,
           non consumare il prodotto e riportalo al punto vendita. Leggi sempre la scheda
           ufficiale: è l'unica fonte autorevole.</p>
      </div>

      ${r.sourceUrl ? `<a class="cta" href="${r.sourceUrl}" target="_blank" rel="noopener">Scheda ufficiale del Ministero</a>` : ''}
      ${r.noticeUrl ? `<a class="cta cta-secondary" href="${r.noticeUrl}" target="_blank" rel="noopener">Avviso di sicurezza collegato</a>` : ''}
    </div>
  `;
  window.scrollTo(0, 0);
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function isMono(label){ return /lotto|scadenza|conservazione|peso|quantit/.test(label); }

/* ---------- Boot ---------- */
loadRecalls().then(data => {
  ALL = data;
  render();
});
window.addEventListener('hashchange', render);
</script>
